<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cronoLite // Final Scanner</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/luxon/3.4.4/luxon.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    
    <style>
        /* --- ESTETICA CYBER-CORE --- */
        :root {
            --bg-deep: #020408;
            --neon-cyan: #00ffcc;
            --neon-green: #0aff60; 
            --text-white: #ffffff;
            --text-dim: #555;
            --panel-bg: #000000;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: var(--bg-deep);
            font-family: 'Courier New', Courier, monospace; /* Font unificato */
            color: var(--text-white);
            cursor: crosshair;
        }

        #app-container {
            display: grid;
            grid-template-rows: auto 1fr auto; 
            height: 100vh; width: 100vw;
        }

        /* --- 1. TOP BAR: SINGLE LINE TICKER --- */
        .top-ticker {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--neon-green);
            height: 45px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            white-space: nowrap;
            overflow: hidden; /* Taglia se troppo lungo, o usa overflow-x: auto per scorrere */
            z-index: 20;
            box-shadow: 0 5px 20px rgba(0, 255, 100, 0.05);
        }

        .metric-group {
            display: flex;
            align-items: baseline;
            margin-right: 30px; /* Spazio tra i blocchi di dati */
        }

        .t-label {
            font-size: 0.65rem;
            color: var(--text-dim);
            margin-right: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: normal;
        }

        .t-val {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Alternanza Colori */
        .color-A { color: var(--text-white); }
        .color-B { color: var(--neon-green); }
        
        /* Orologio High-Vis */
        .clock-main { font-size: 1.3rem; margin-right: 5px; }
        .clock-nano { font-size: 0.8rem; opacity: 0.8; letter-spacing: 1px; }


        /* --- 2. MAPPA --- */
        #map-wrapper { 
            position: relative; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, #0e151d 0%, #000 90%);
            overflow: hidden;
        }

        .ocean-band { fill: none; stroke: #ffffff; stroke-opacity: 0.03; stroke-width: 0.5px; }

        .land { 
            stroke: #000; stroke-width: 0.1px; 
            transition: fill 0.2s, stroke 0.2s;
        }
        .land.hovered { stroke: var(--neon-green); stroke-width: 1px; filter: brightness(1.4); }

        .night { fill: #000; fill-opacity: 0.75; pointer-events: none; }
        .night-blur { filter: url(#twilight-filter); }

        /* Scanner Lines */
        .scanner-line {
            position: absolute; background: var(--neon-green); opacity: 0.4; pointer-events: none;
            z-index: 10;
        }
        #scanner-x { height: 100%; width: 1px; top: 0; left: 50%; } 
        #scanner-y { width: 100%; height: 1px; top: 50%; left: 0; }
        
        #scanner-tag {
            position: absolute; background: rgba(0,0,0,0.9); border: 1px solid var(--neon-green);
            color: var(--neon-green); padding: 2px 6px; font-size: 0.7rem; pointer-events: none;
            display: none; z-index: 15; transform: translate(10px, -30px);
        }

        /* --- 3. BOTTOM BAR --- */
        .hud-footer {
            background: var(--panel-bg);
            border-top: 1px solid var(--neon-green); /* Verde coerente */
            padding: 10px 30px;
            display: flex; justify-content: space-between; align-items: center;
            height: 60px;
            z-index: 20;
        }

        .d-head { font-size: 0.6rem; color: var(--neon-green); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
        .d-main { font-size: 1.2rem; color: #fff; font-weight: bold; white-space: nowrap; }
        .d-sub { font-size: 0.75rem; color: #777; }

    </style>
</head>
<body>

    <svg style="height:0; position:absolute;">
        <defs>
            <filter id="twilight-filter" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="4" />
            </filter>
        </defs>
    </svg>

    <div id="app-container">
        
        <header class="top-ticker">
            <div class="metric-group">
                <span class="t-label">EON</span>
                <span class="t-val color-A">PHANEROZOIC</span>
            </div>
            <div class="metric-group">
                <span class="t-label">ERA</span>
                <span class="t-val color-B">CENOZOIC</span>
            </div>
            <div class="metric-group">
                <span class="t-label">SYS</span>
                <span class="t-val color-A">QUATERNARY</span>
            </div>
            <div class="metric-group">
                <span class="t-label">SER</span>
                <span class="t-val color-B">HOLOCENE</span>
            </div>
            <div class="metric-group">
                <span class="t-label">STG</span>
                <span class="t-val color-A">MEGHALAYAN</span>
            </div>

            <div class="metric-group" style="opacity: 0.3; margin-right: 30px;">|</div>

            <div class="metric-group">
                <span class="t-label">YEAR</span>
                <span class="t-val color-B" id="v-year">--</span>
            </div>
            <div class="metric-group">
                <span class="t-label">WEEK</span>
                <span class="t-val color-A" id="v-week">--</span>
            </div>
            <div class="metric-group">
                <span class="t-label">DAY</span>
                <span class="t-val color-B" id="v-day">--</span>
            </div>

            <div class="metric-group" style="margin-left: auto; margin-right: 0;">
                <span class="t-val color-A clock-main" id="v-hms">00:00:00</span>
                <span class="t-val color-B clock-nano">
                    <span id="v-ms">.000</span> <span id="v-micro" style="opacity:0.6">000</span> <span id="v-nano" style="opacity:0.3">000</span>
                </span>
            </div>
        </header>

        <div id="map-wrapper">
            <div id="scanner-x" class="scanner-line"></div>
            <div id="scanner-y" class="scanner-line"></div>
            <div id="scanner-tag">UTC</div>
        </div>

        <footer class="hud-footer">
            <div style="display:flex; flex-direction:column;">
                <span class="d-head">TARGET SECTOR</span>
                <span class="d-main" id="inf-name">SYSTEM READY</span>
                <span class="d-sub" id="inf-id">HOVER MAP TO IDENTIFY</span>
            </div>

            <div style="display:flex; flex-direction:column; align-items: flex-end; text-align: right;">
                <span class="d-head">LOCAL TIME & OFFSET</span>
                <span class="d-main" id="inf-offset">UTC --</span>
                <span class="d-sub" id="inf-coords">00.0° N, 00.0° W</span>
            </div>
        </footer>
    </div>

    <script>
        const DateTime = luxon.DateTime;
        
        // --- DIZIONARIO NOMI PAESI ---
        // TopoJSON 110m usa codici numerici (ISO 3166-1 numeric). 
        // Questo oggetto mappa l'ID al nome da visualizzare.
        const countryMap = {
            4:"AFGHANISTAN", 8:"ALBANIA", 12:"ALGERIA", 24:"ANGOLA", 32:"ARGENTINA", 36:"AUSTRALIA", 
            40:"AUSTRIA", 31:"AZERBAIJAN", 50:"BANGLADESH", 112:"BELARUS", 56:"BELGIUM", 68:"BOLIVIA", 
            70:"BOSNIA AND HERZ.", 72:"BOTSWANA", 76:"BRAZIL", 100:"BULGARIA", 854:"BURKINA FASO", 
            108:"BURUNDI", 116:"CAMBODIA", 120:"CAMEROON", 124:"CANADA", 140:"C. AFRICAN REP.", 
            148:"CHAD", 152:"CHILE", 156:"CHINA", 170:"COLOMBIA", 178:"CONGO", 180:"DR CONGO", 
            188:"COSTA RICA", 384:"CÔTE D'IVOIRE", 191:"CROATIA", 192:"CUBA", 196:"CYPRUS", 
            203:"CZECHIA", 208:"DENMARK", 214:"DOMINICAN REP.", 218:"ECUADOR", 818:"EGYPT", 
            222:"EL SALVADOR", 231:"ETHIOPIA", 246:"FINLAND", 250:"FRANCE", 266:"GABON", 
            268:"GEORGIA", 276:"GERMANY", 288:"GHANA", 300:"GREECE", 304:"GREENLAND", 320:"GUATEMALA", 
            324:"GUINEA", 328:"GUYANA", 332:"HAITI", 340:"HONDURAS", 348:"HUNGARY", 352:"ICELAND", 
            356:"INDIA", 360:"INDONESIA", 364:"IRAN", 368:"IRAQ", 372:"IRELAND", 376:"ISRAEL", 
            380:"ITALY", 388:"JAMAICA", 392:"JAPAN", 400:"JORDAN", 398:"KAZAKHSTAN", 404:"KENYA", 
            408:"NORTH KOREA", 410:"SOUTH KOREA", 414:"KUWAIT", 417:"KYRGYZSTAN", 418:"LAOS", 
            428:"LATVIA", 422:"LEBANON", 426:"LESOTHO", 430:"LIBERIA", 434:"LIBYA", 440:"LITHUANIA", 
            442:"LUXEMBOURG", 450:"MADAGASCAR", 454:"MALAWI", 458:"MALAYSIA", 466:"MALI", 
            484:"MEXICO", 498:"MOLDOVA", 496:"MONGOLIA", 499:"MONTENEGRO", 504:"MOROCCO", 
            508:"MOZAMBIQUE", 104:"MYANMAR", 516:"NAMIBIA", 524:"NEPAL", 528:"NETHERLANDS", 
            554:"NEW ZEALAND", 558:"NICARAGUA", 562:"NIGER", 566:"NIGERIA", 578:"NORWAY", 
            512:"OMAN", 586:"PAKISTAN", 591:"PANAMA", 598:"PAPUA NEW GUINEA", 600:"PARAGUAY", 
            604:"PERU", 608:"PHILIPPINES", 616:"POLAND", 620:"PORTUGAL", 634:"QATAR", 642:"ROMANIA", 
            643:"RUSSIA", 646:"RWANDA", 682:"SAUDI ARABIA", 686:"SENEGAL", 688:"SERBIA", 
            694:"SIERRA LEONE", 703:"SLOVAKIA", 705:"SLOVENIA", 90:"SOLOMON IS.", 706:"SOMALIA", 
            710:"SOUTH AFRICA", 728:"SOUTH SUDAN", 724:"SPAIN", 144:"SRI LANKA", 729:"SUDAN", 
            740:"SURINAME", 752:"SWEDEN", 756:"SWITZERLAND", 760:"SYRIA", 158:"TAIWAN", 
            762:"TAJIKISTAN", 834:"TANZANIA", 764:"THAILAND", 626:"TIMOR-LESTE", 768:"TOGO", 
            780:"TRINIDAD AND TOBAGO", 788:"TUNISIA", 792:"TURKEY", 795:"TURKMENISTAN", 
            800:"UGANDA", 804:"UKRAINE", 784:"UAE", 826:"UNITED KINGDOM", 840:"UNITED STATES", 
            858:"URUGUAY", 860:"UZBEKISTAN", 862:"VENEZUELA", 704:"VIETNAM", 732:"W. SAHARA", 
            887:"YEMEN", 894:"ZAMBIA", 716:"ZIMBABWE"
        };

        const mapContainer = document.getElementById("map-wrapper");
        const svg = d3.select("#map-wrapper").append("svg").attr("width", "100%").attr("height", "100%");
        const projection = d3.geoEqualEarth();
        const path = d3.geoPath(projection);

        function resizeMap() {
            const w = mapContainer.clientWidth;
            const h = mapContainer.clientHeight;
            projection.fitExtent([[20, 20], [w - 20, h - 20]], {type: "Sphere"});
            svg.selectAll("path").attr("d", path);
        }
        window.addEventListener("resize", resizeMap);

        const gOcean = svg.append("g");
        const gLand = svg.append("g");
        const gNight = svg.append("g");

        // Scala colori fusi orari
        const tzColorScale = d3.scaleLinear()
            .domain([-12, 0, 14])
            .range(["#2c3e50", "#00ffcc", "#134e5e"])
            .interpolate(d3.interpolateRgb);

        // --- CALCOLO OFFSET SIMULATO (Come versione precedente) ---
        const countryOffsets = { 156: 8, 356: 5.5, 724: 1, 250: 1, 380: 1, 276: 1, 826: 0, 392: 9, 32: -3, 364: 3.5 };
        function getOffset(feature, lon) {
            const id = feature.id;
            // USA
            if (id === 840) return (lon > -85)?-5:(lon>-100)?-6:(lon>-114)?-7:-8;
            // Russia
            if (id === 643) return (lon < 40)?3:(lon<60)?5:(lon<80)?7:(lon<100)?8:10;
            // Australia
            if (id === 36) return (lon < 129)?8:(lon<138)?9.5:10;
            // Canada
            if (id === 124) return (lon > -65)?-4:(lon>-85)?-5:(lon>-102)?-6:(lon>-114)?-7:-8;
            // Brazil
            if (id === 76) return (lon < -60)?-4:-3;
            // Default Political or Geometric
            if (countryOffsets[id] !== undefined) return countryOffsets[id];
            return Math.round(lon / 15);
        }

        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(data => {
            const countries = topojson.feature(data, data.objects.countries).features;
            
            countries.forEach(d => {
                const center = d3.geoCentroid(d);
                d.properties.baseOffset = getOffset(d, center[0]);
            });

            resizeMap();

            // Sfondo Oceano
            gOcean.append("path").datum(d3.geoGraticule().step([15, 0]))
                .attr("class", "ocean-band").attr("d", path);

            // Nazioni
            gLand.selectAll("path").data(countries).enter().append("path")
                .attr("class", "land")
                .attr("d", path)
                .attr("fill", d => tzColorScale(d.properties.baseOffset))
                .on("mouseenter", function(e, d) {
                    activeFeature = d;
                    d3.select(this).classed("hovered", true);
                })
                .on("mouseleave", function(e, d) {
                    activeFeature = null;
                    d3.select(this).classed("hovered", false);
                });

            updateSolarTerminator();
            requestAnimationFrame(timeLoop);
        });

        // --- LOOP ---
        let activeFeature = null;
        let lastSunUpdate = 0;

        mapContainer.addEventListener("mousemove", (e) => {
            const rect = mapContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            document.getElementById("scanner-x").style.left = x + "px";
            document.getElementById("scanner-y").style.top = y + "px";
            
            const coords = projection.invert([x, y]);
            if (!coords) return;
            const [lon, lat] = coords;

            let offset, name, idText;

            if (activeFeature) {
                // USARE IL DIZIONARIO PER IL NOME
                name = countryMap[activeFeature.id] || "SOVEREIGN TERRITORY";
                idText = "ISO: " + activeFeature.id;
                offset = getOffset(activeFeature, lon);
            } else {
                name = "INTERNATIONAL WATERS";
                idText = "SECTOR: OCEANIC";
                offset = Math.round(lon / 15);
            }

            const sign = offset >= 0 ? "+" : "";
            const zoneTime = DateTime.now().toUTC().plus({ hours: offset });

            // Aggiorna Footer
            document.getElementById("inf-name").innerText = name;
            document.getElementById("inf-id").innerText = idText;
            document.getElementById("inf-offset").innerText = `UTC ${sign}${offset} [${zoneTime.toFormat("HH:mm")}]`;
            document.getElementById("inf-coords").innerText = `${Math.abs(lat).toFixed(2)}° ${lat>0?'N':'S'}, ${Math.abs(lon).toFixed(2)}° ${lon>0?'E':'W'}`;

            // Tag
            const tag = document.getElementById("scanner-tag");
            tag.style.display = "block";
            tag.style.left = (x + 10) + "px";
            tag.style.top = (y - 30) + "px";
            tag.innerText = `UTC ${sign}${offset}`;
        });

        function updateSolarTerminator() {
            const now = new Date();
            const rad = Math.PI / 180;
            const day = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
            const declination = -23.44 * Math.cos(rad * 360 / 365 * (day + 10));
            const utcHours = now.getUTCHours() + now.getUTCMinutes()/60;
            const antiSunLon = ((-15 * (utcHours - 12)) + 180);
            
            const circle = d3.geoCircle().center([antiSunLon, -declination]).radius(90)();
            const nightPath = gNight.selectAll("path").data([circle]);
            nightPath.enter().append("path").attr("class", "night night-blur").merge(nightPath).attr("d", path);
        }

        function timeLoop() {
            const now = DateTime.now();

            document.getElementById("v-year").innerText = now.year;
            document.getElementById("v-week").innerText = now.weekNumber;
            document.getElementById("v-day").innerText = now.ordinal;
            document.getElementById("v-hms").innerText = now.toFormat("HH:mm:ss");
            document.getElementById("v-ms").innerText = "." + now.toFormat("SSS");

            const micro = Math.floor(performance.now() % 1000).toString().padStart(3,'0');
            const nano = Math.floor(Math.random() * 999).toString().padStart(3,'0');
            document.getElementById("v-micro").innerText = micro;
            document.getElementById("v-nano").innerText = nano;

            if (Date.now() - lastSunUpdate > 1000) {
                updateSolarTerminator();
                lastSunUpdate = Date.now();
            }
            requestAnimationFrame(timeLoop);
        }
    </script>
</body>
</html>
