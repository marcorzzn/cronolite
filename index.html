<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cronoLite // Fast Core</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/luxon/3.4.4/luxon.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    
    <style>
        /* --- CORE STYLES --- */
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            color: #e0e0e0;
        }

        #app-container {
            display: grid;
            grid-template-rows: auto 1fr;
            height: 100vh; width: 100vw;
        }

        /* --- HEADER MINIMALE --- */
        .hud-header {
            padding: 10px 20px;
            background: #000;
            border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10;
        }

        .main-clock {
            font-size: 2.5rem; font-weight: bold;
            color: #fff; letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
        }
        .milliseconds { color: #00ffcc; font-size: 1rem; vertical-align: baseline; }

        .location-label {
            font-size: 0.8rem; color: #00ffcc; text-transform: uppercase; letter-spacing: 2px;
        }

        /* --- MAPPA PERFORMANCE --- */
        #map-wrapper { 
            position: relative; width: 100%; height: 100%; 
            background: #020408; /* Colore dello spazio profondo */
        }

        /* 1. ZONA DI LUCE (GIORNO) */
        /* La sfera base rappresenta la terra illuminata */
        .sphere { 
            fill: #1a2530; /* Colore Oceano Giorno (Blu scuro ma visibile) */
        }
        
        .land { 
            fill: #e0f7fa; /* TERRA ILLUMINATA: Biancastro/Ciano chiaro */
            stroke: none;
            transition: fill 0.5s;
        }

        /* 2. ZONA DI BUIO (NOTTE) */
        /* Questo layer copre la terra e l'oceano */
        .night { 
            fill: #000000; 
            fill-opacity: 0.85; /* Non nero totale, lascia intravedere appena */
        }

        /* 3. CREPUSCOLO (SFUMATURA) */
        /* Usiamo un filtro SVG blur per sfumare il bordo della notte */
        .night-blur {
            filter: url(#twilight-filter);
        }

        /* Griglia e dettagli */
        .graticule { fill: none; stroke: #333; stroke-width: 0.5px; stroke-dasharray: 2,2; }
        
        /* Cursore interattivo */
        .cursor-info {
            position: absolute; bottom: 20px; right: 20px;
            text-align: right; pointer-events: none;
        }
        .info-val { font-size: 1.2rem; color: #fff; font-weight: bold; }
        .info-label { font-size: 0.7rem; color: #666; text-transform: uppercase; }

    </style>
</head>
<body>

    <svg style="height:0; position:absolute;">
        <defs>
            <filter id="twilight-filter" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="5" />
            </filter>
        </defs>
    </svg>

    <div id="app-container">
        <header class="hud-header">
            <div>
                <div class="location-label" id="current-city">ROMA</div>
                <div class="main-clock">
                    <span id="clock-hms">00:00:00</span><span class="milliseconds" id="clock-ms">.00</span>
                </div>
            </div>
            <div style="display:flex; gap:15px; font-size:0.8rem;">
                <span onclick="setZone('Europe/Rome', 'ROMA')" style="cursor:pointer; color:#00ffcc">ROM</span>
                <span onclick="setZone('America/New_York', 'NEW YORK')" style="cursor:pointer; color:#777">NYC</span>
                <span onclick="setZone('Asia/Tokyo', 'TOKYO')" style="cursor:pointer; color:#777">TKY</span>
            </div>
        </header>

        <div id="map-wrapper">
            <div class="cursor-info">
                <div class="info-val" id="solar-status">--</div>
                <div class="info-label">Stato Solare</div>
            </div>
        </div>
    </div>

    <script>
        // --- SETUP VELOCE ---
        const DateTime = luxon.DateTime;
        let activeZone = "Europe/Rome";
        
        const mapContainer = document.getElementById("map-wrapper");
        const width = mapContainer.clientWidth;
        const height = mapContainer.clientHeight;

        // SVG Container
        const svg = d3.select("#map-wrapper").append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .attr("viewBox", [0, 0, width, height]);

        // Proiezione (Equal Earth è bella, ma Mercator è leggermente più veloce nei calcoli. Teniamo Equal Earth per estetica)
        const projection = d3.geoEqualEarth()
            .scale(width / 5.5)
            .translate([width / 2, height / 2]);

        const path = d3.geoPath(projection);

        // --- LAYER RENDERING (Ordine: Mare -> Terra -> Notte) ---
        const gSphere = svg.append("g");
        const gLand = svg.append("g");
        const gGraticule = svg.append("g");
        const gNight = svg.append("g"); // L'ombra va sopra tutto

        // Setup Zoom (Migliorato per performance)
        const zoom = d3.zoom()
            .scaleExtent([1, 8])
            .on("zoom", (event) => {
                const t = event.transform;
                gSphere.attr("transform", t);
                gLand.attr("transform", t);
                gGraticule.attr("transform", t);
                gNight.attr("transform", t);
                // Non ridisegniamo stroke-width durante lo zoom per non laggare
            });
        svg.call(zoom);

        // --- CARICAMENTO DATI (CDN VELOCE - Solo Nazioni) ---
        // Usiamo un file ottimizzato da 50kb invece di 15MB
        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(data => {
            
            // 1. Disegna Sfera (Oceano)
            gSphere.append("path")
                .datum({type: "Sphere"})
                .attr("class", "sphere")
                .attr("d", path);

            // 2. Disegna Griglia
            gGraticule.append("path")
                .datum(d3.geoGraticule())
                .attr("class", "graticule")
                .attr("d", path);

            // 3. Disegna Terre Emerse (Bianche per indicare luce)
            const countries = topojson.feature(data, data.objects.countries);
            gLand.selectAll("path")
                .data(countries.features)
                .enter().append("path")
                .attr("class", "land")
                .attr("d", path);

            // Avvia loop
            updateSolarTerminator();
            requestAnimationFrame(updateLoop);
        });

        // --- CALCOLO SOLARE EFFICIENTE ---
        function getSunPosition(date) {
            const rad = Math.PI / 180;
            const day = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
            const declination = -23.44 * Math.cos(rad * 360 / 365 * (day + 10));
            const utcHours = date.getUTCHours() + date.getUTCMinutes()/60;
            const lambda = -15 * (utcHours - 12);
            return [lambda, declination];
        }

        // --- LOOP PRINCIPALE (Separato per non intasare) ---
        let lastSunUpdate = 0;

        function updateLoop() {
            const now = DateTime.now().setZone(activeZone);
            const jsDate = new Date();

            // 1. Aggiorna Orologio (Ogni frame)
            document.getElementById('clock-hms').innerText = now.toFormat('HH:mm:ss');
            document.getElementById('clock-ms').innerText = "." + now.toFormat('SS'); // Solo 2 cifre ms per stabilità visiva

            // 2. Aggiorna Ombra (Ogni 500ms è sufficiente, l'occhio non nota la differenza)
            if (jsDate.getTime() - lastSunUpdate > 500) {
                updateSolarTerminator(jsDate);
                lastSunUpdate = jsDate.getTime();
            }

            requestAnimationFrame(updateLoop);
        }

        function updateSolarTerminator(date = new Date()) {
            const sunPos = getSunPosition(date);
            const antiSun = [sunPos[0] + 180, -sunPos[1]];
            
            // Cerchio d'ombra (Notte)
            const circle = d3.geoCircle().center(antiSun).radius(90)();

            // Aggiorna Path Notte
            const nightPath = gNight.selectAll("path").data([circle]);
            
            nightPath.enter().append("path")
                .attr("class", "night night-blur") // Applica la classe Blur
                .merge(nightPath)
                .attr("d", path);
            
            // Info Debug
            document.getElementById("solar-status").innerText = "Zenith " + sunPos[0].toFixed(1) + "°";
        }

        // --- INTERAZIONE UI ---
        window.setZone = function(zone, label) {
            activeZone = zone;
            document.getElementById('current-city').innerText = label;
            
            // Aggiorna stile pulsanti (semplice reset colore)
            document.querySelectorAll('span[onclick]').forEach(el => el.style.color = '#777');
            event.target.style.color = '#00ffcc';
        }

    </script>
</body>
</html>
