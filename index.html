<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cronoLite // TZ Database Core</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/luxon/3.4.4/luxon.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    
    <style>
        /* --- ESTETICA CYBER-CORE --- */
        :root {
            --bg-deep: #020408;
            --neon-cyan: #00ffcc;
            --neon-green: #0aff60; /* Verde richiesto */
            --text-white: #ffffff;
            --text-dim: #666;
            --panel-bg: #000000;
            --border-color: #1a1a1a;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: var(--bg-deep);
            font-family: 'Courier New', Courier, monospace;
            color: var(--text-white);
            cursor: crosshair;
        }

        #app-container {
            display: grid;
            grid-template-rows: auto 1fr auto; /* Header - Mappa - Footer */
            height: 100vh; width: 100vw;
        }

        /* --- 1. TOP BAR: DEEP TIME SCALE --- */
        .deep-time-bar {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--neon-green);
            display: flex; flex-direction: column;
            padding: 8px 0;
            z-index: 20;
            box-shadow: 0 5px 20px rgba(0, 255, 100, 0.05);
        }

        /* Riga Superiore: Scala Geologica */
        .geo-scale-row {
            display: flex; justify-content: space-around;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px; margin-bottom: 6px;
        }
        
        .geo-item { display: flex; flex-direction: column; align-items: flex-start; }
        .geo-label { 
            font-size: 0.55rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px;
        }
        .geo-val { font-size: 0.85rem; font-weight: bold; letter-spacing: 0.5px; }
        
        /* Alternanza Colori (Bianco / Verde) */
        .geo-item:nth-child(odd) .geo-val { color: var(--text-white); }
        .geo-item:nth-child(even) .geo-val { color: var(--neon-green); }

        /* Riga Inferiore: Data Umana e Clock */
        .human-time-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px;
        }

        .h-group { display: flex; gap: 20px; align-items: baseline; }
        .h-label { font-size: 0.6rem; color: var(--text-dim); margin-right: 4px; }
        .h-val { font-size: 1rem; font-weight: bold; color: var(--text-white); }
        .h-val.accent { color: var(--neon-cyan); }

        /* Orologio Principale */
        .master-clock {
            font-size: 1.8rem; font-weight: bold; color: var(--text-white);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            font-variant-numeric: tabular-nums;
        }
        .nano-metrics {
            font-family: monospace; font-size: 0.8rem; color: var(--neon-green);
            opacity: 0.8; letter-spacing: 1px; margin-left: 10px;
        }
        .faint { opacity: 0.4; }

        /* --- 2. MAPPA: TZ DATABASE VISUALIZER --- */
        #map-wrapper { 
            position: relative; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, #0e151d 0%, #000 90%);
            overflow: hidden;
        }

        /* Ocean Bands (Geometriche) */
        .ocean-band { fill: none; stroke: #ffffff; stroke-opacity: 0.03; stroke-width: 0.5px; }

        /* Nazioni */
        .land { 
            stroke: #000; stroke-width: 0.1px; 
            transition: fill 0.2s, stroke 0.2s;
        }
        /* Colori dinamici assegnati via JS in base all'offset */

        .land.hovered { stroke: var(--neon-cyan); stroke-width: 0.8px; filter: brightness(1.3); }
        .land.active-zone { filter: brightness(1.2); }

        /* Terminatore Notte */
        .night { fill: #000; fill-opacity: 0.75; pointer-events: none; }
        .night-blur { filter: url(#twilight-filter); }

        /* Scanner */
        .scanner-line {
            position: absolute; background: var(--neon-green); opacity: 0.4; pointer-events: none;
            z-index: 10;
        }
        #scanner-x { height: 100%; width: 1px; top: 0; left: 50%; } 
        #scanner-y { width: 100%; height: 1px; top: 50%; left: 0; }
        
        #scanner-tag {
            position: absolute; background: rgba(0,0,0,0.8); border: 1px solid var(--neon-green);
            color: var(--neon-green); padding: 2px 6px; font-size: 0.7rem; pointer-events: none;
            display: none; z-index: 15; transform: translate(10px, -25px);
        }

        /* --- 3. BOTTOM BAR: INFO --- */
        .hud-footer {
            background: var(--panel-bg);
            border-top: 1px solid var(--neon-cyan);
            padding: 10px 30px;
            display: flex; justify-content: space-between; align-items: center;
            height: 65px; /* Altezza fissa per evitare troncamenti */
            z-index: 20;
        }

        .data-block { display: flex; flex-direction: column; justify-content: center; }
        .d-head { font-size: 0.6rem; color: var(--neon-cyan); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
        .d-main { font-size: 1.1rem; color: #fff; font-weight: bold; white-space: nowrap; }
        .d-sub { font-size: 0.75rem; color: #888; margin-top: 2px; }

    </style>
</head>
<body>

    <svg style="height:0; position:absolute;">
        <defs>
            <filter id="twilight-filter" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="4" />
            </filter>
        </defs>
    </svg>

    <div id="app-container">
        
        <header class="deep-time-bar">
            <div class="geo-scale-row">
                <div class="geo-item">
                    <span class="geo-label">EONOTHEM / EON</span>
                    <span class="geo-val">PHANEROZOIC</span>
                </div>
                <div class="geo-item">
                    <span class="geo-label">ERATHEM / ERA</span>
                    <span class="geo-val">CENOZOIC</span>
                </div>
                <div class="geo-item">
                    <span class="geo-label">SYSTEM / PERIOD</span>
                    <span class="geo-val">QUATERNARY</span>
                </div>
                <div class="geo-item">
                    <span class="geo-label">SERIES / EPOCH</span>
                    <span class="geo-val">HOLOCENE</span>
                </div>
                <div class="geo-item">
                    <span class="geo-label">STAGE / AGE</span>
                    <span class="geo-val">MEGHALAYAN</span>
                </div>
            </div>

            <div class="human-time-row">
                <div class="h-group">
                    <div><span class="h-label">ERA UMANA</span><span class="h-val accent" id="val-era">--</span></div>
                    <div><span class="h-label">ANNO</span><span class="h-val" id="val-year">--</span></div>
                    <div><span class="h-label">SETT</span><span class="h-val" id="val-week">--</span></div>
                    <div><span class="h-label">GIORNO</span><span class="h-val" id="val-day">--</span></div>
                </div>
                
                <div style="display:flex; align-items:baseline;">
                    <span class="master-clock" id="val-hms">00:00:00</span>
                    <span class="nano-metrics">
                        <span id="val-ms">.000</span> <span id="val-micro" class="faint">000</span> <span id="val-nano" class="faint" style="opacity:0.3">000</span>
                    </span>
                </div>
            </div>
        </header>


        <div id="map-wrapper">
            <div id="scanner-x" class="scanner-line"></div>
            <div id="scanner-y" class="scanner-line"></div>
            <div id="scanner-tag">UTC</div>
        </div>


        <footer class="hud-footer">
            <div class="data-block">
                <span class="d-head">TARGET REGION</span>
                <span class="d-main" id="inf-name">SYSTEM READY</span>
                <span class="d-sub" id="inf-id">WAITING INPUT...</span>
            </div>

            <div class="data-block" style="text-align: right; align-items: flex-end;">
                <span class="d-head">TZ DATABASE OFFSET</span>
                <span class="d-main" id="inf-offset">UTC --</span>
                <span class="d-sub" id="inf-coords">00.00° N, 00.00° W</span>
            </div>
        </footer>

    </div>

    <script>
        const DateTime = luxon.DateTime;
        
        // --- CONFIGURAZIONE MAPPA ---
        const mapContainer = document.getElementById("map-wrapper");
        const svg = d3.select("#map-wrapper").append("svg")
            .attr("width", "100%")
            .attr("height", "100%");

        // Proiezione Equal Earth con FitExtent (Risolve i bordi tagliati)
        const projection = d3.geoEqualEarth();
        const path = d3.geoPath(projection);

        function resizeMap() {
            const w = mapContainer.clientWidth;
            const h = mapContainer.clientHeight;
            // Margine di 20px per sicurezza
            projection.fitExtent([[20, 20], [w - 20, h - 20]], {type: "Sphere"});
            svg.selectAll("path").attr("d", path);
        }
        window.addEventListener("resize", resizeMap);

        // Layers
        const gOcean = svg.append("g");
        const gLand = svg.append("g");
        const gNight = svg.append("g");

        // Genera colori per i fusi orari (Spettro Freddo/Cyber)
        // Mappiamo offset -12 -> +14 su una scala di colori
        const tzColorScale = d3.scaleLinear()
            .domain([-12, 0, 14])
            .range(["#2c3e50", "#4ca1af", "#134e5e"]) // Blu scuro -> Ciano -> Turchese scuro
            .interpolate(d3.interpolateRgb);

        // --- LOGICA TZ DATABASE SIMULATA ---
        // Poiché i confini esatti IANA pesano 10MB, usiamo la geometria dei paesi
        // corretta da un dizionario avanzato e algoritmi di suddivisione (split) per i grandi paesi.
        
        // Offset base per nazioni a singolo fuso
        const countryOffsets = {
            156: 8,  // Cina (Tutta +8)
            356: 5.5,// India (+5:30)
            724: 1,  // Spagna (+1)
            250: 1,  // Francia (+1)
            380: 1,  // Italia (+1)
            276: 1,  // Germania (+1)
            826: 0,  // UK
            392: 9,  // Giappone
            32: -3,  // Argentina
            364: 3.5 // Iran
        };

        // Funzione per calcolare l'offset di un punto (simulazione IANA)
        function getOffset(feature, lon) {
            const id = feature.id;
            
            // 1. Eccezioni per Grandi Paesi (Suddivisione geometrica approssimata)
            
            // USA (840)
            if (id === 840) {
                if (lon > -85) return -5; // EST
                if (lon > -100) return -6; // CST
                if (lon > -114) return -7; // MST
                return -8; // PST
            }
            // Russia (643) - Semplificata
            if (id === 643) {
                if (lon < 40) return 3; // Mosca
                if (lon < 60) return 5;
                if (lon < 80) return 7;
                if (lon < 100) return 8;
                return 10; 
            }
            // Australia (36)
            if (id === 36) {
                if (lon < 129) return 8;
                if (lon < 138) return 9.5;
                return 10;
            }
            // Canada (124)
            if (id === 124) {
                if (lon > -65) return -4;
                if (lon > -85) return -5;
                if (lon > -102) return -6;
                if (lon > -114) return -7;
                return -8;
            }
            // Brasile (76)
            if (id === 76) {
                if (lon < -60) return -4;
                return -3; // Brasilia
            }

            // 2. Lookup da Dizionario Politico
            if (countryOffsets[id] !== undefined) return countryOffsets[id];

            // 3. Fallback Geometrico (Lon / 15)
            return Math.round(lon / 15);
        }

        // --- CARICAMENTO DATI ---
        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(data => {
            const countries = topojson.feature(data, data.objects.countries).features;
            
            // Pre-processamento colori
            countries.forEach(d => {
                const center = d3.geoCentroid(d);
                // Calcoliamo un offset "medio" per colorare l'intero paese
                // (Per paesi divisi come USA, usiamo il centroide per il colore base)
                d.properties.baseOffset = getOffset(d, center[0]);
            });

            resizeMap();

            // 1. Bande Oceaniche (Meridiani ogni 15 gradi)
            const meridians = d3.geoGraticule().step([15, 0]);
            gOcean.append("path")
                .datum(meridians)
                .attr("class", "ocean-band")
                .attr("d", path);

            // 2. Nazioni (Colorate per TimeZone)
            gLand.selectAll("path")
                .data(countries)
                .enter().append("path")
                .attr("class", "land")
                .attr("d", path)
                .attr("fill", d => tzColorScale(d.properties.baseOffset))
                // Interaction
                .on("mouseenter", function(e, d) {
                    activeFeature = d;
                    d3.select(this).classed("hovered", true);
                })
                .on("mouseleave", function(e, d) {
                    activeFeature = null;
                    d3.select(this).classed("hovered", false);
                });

            // Avvio Loops
            updateSolarTerminator();
            requestAnimationFrame(timeLoop);
        });

        // --- LOOP PRINCIPALE ---
        let activeFeature = null;
        let lastSunUpdate = 0;

        // Gestione Mouse Move (Scanner)
        mapContainer.addEventListener("mousemove", (e) => {
            const rect = mapContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Aggiorna Linee Scanner
            document.getElementById("scanner-x").style.left = x + "px";
            document.getElementById("scanner-y").style.top = y + "px";
            
            // Calcola Coordinate
            const coords = projection.invert([x, y]);
            if (!coords) return;
            const [lon, lat] = coords;

            // Determina Offset Reale
            let offset;
            let regionName = "INTERNATIONAL WATERS";
            let regionId = "OCEANIC SECTOR";

            if (activeFeature) {
                // Se sopra una nazione, usa la logica "Politica/Simulata"
                // Passiamo la longitudine del mouse per gestire i fusi interni (USA, RU)
                offset = getOffset(activeFeature, lon);
                // Nome paese (dizionario minimale)
                regionName = "SOVEREIGN TERRITORY"; // Placeholder, idealmente usare dizionario nomi
                regionId = "ISO: " + activeFeature.id;
            } else {
                // Oceano: Geometria pura
                offset = Math.round(lon / 15);
            }

            // Aggiorna UI Footer
            const sign = offset >= 0 ? "+" : "";
            const zoneTime = DateTime.now().toUTC().plus({ hours: offset });

            document.getElementById("inf-name").innerText = regionName;
            document.getElementById("inf-id").innerText = regionId;
            document.getElementById("inf-offset").innerText = `UTC ${sign}${offset} [${zoneTime.toFormat("HH:mm")}]`;
            document.getElementById("inf-coords").innerText = `${Math.abs(lat).toFixed(2)}°${lat>0?'N':'S'}, ${Math.abs(lon).toFixed(2)}°${lon>0?'E':'W'}`;

            // Tag Galleggiante
            const tag = document.getElementById("scanner-tag");
            tag.style.display = "block";
            tag.style.left = (x + 10) + "px";
            tag.style.top = (y - 30) + "px";
            tag.innerText = `UTC ${sign}${offset}`;
        });

        function updateSolarTerminator() {
            const now = new Date();
            const rad = Math.PI / 180;
            const day = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
            const declination = -23.44 * Math.cos(rad * 360 / 365 * (day + 10));
            const utcHours = now.getUTCHours() + now.getUTCMinutes()/60;
            const antiSunLon = ((-15 * (utcHours - 12)) + 180);
            
            const circle = d3.geoCircle().center([antiSunLon, -declination]).radius(90)();
            const nightPath = gNight.selectAll("path").data([circle]);
            nightPath.enter().append("path")
                .attr("class", "night night-blur")
                .merge(nightPath).attr("d", path);
        }

        function timeLoop() {
            const now = DateTime.now();

            // Aggiorna Orologi
            document.getElementById("val-era").innerText = (now.year + 10000) + " HE";
            document.getElementById("val-year").innerText = now.year;
            document.getElementById("val-week").innerText = now.weekNumber;
            document.getElementById("val-day").innerText = now.ordinal;
            document.getElementById("val-hms").innerText = now.toFormat("HH:mm:ss");
            document.getElementById("val-ms").innerText = "." + now.toFormat("SSS");

            // Nano-Simulazione
            const micro = Math.floor(performance.now() % 1000).toString().padStart(3,'0');
            const nano = Math.floor(Math.random() * 999).toString().padStart(3,'0');
            document.getElementById("val-micro").innerText = micro;
            document.getElementById("val-nano").innerText = nano;

            // Sole (ogni 1s)
            if (Date.now() - lastSunUpdate > 1000) {
                updateSolarTerminator();
                lastSunUpdate = Date.now();
            }

            requestAnimationFrame(timeLoop);
        }

    </script>
</body>
</html>
