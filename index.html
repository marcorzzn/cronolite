<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cronoLite // Full Scanner</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/luxon/3.4.4/luxon.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    
    <style>
        /* --- CORE STYLES --- */
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            color: #e0e0e0;
            cursor: none; 
        }

        #app-container {
            display: grid;
            /* Definisce 3 righe: Header Dati (Giallo), Mappa (Rosso), Footer Info (Blu) */
            grid-template-rows: auto 1fr auto; 
            height: 100vh; width: 100vw;
        }

        /* --- 1. ZONA GIALLA: STRISCIA TEMPORALE --- */
        .time-strip {
            background: #000;
            border-bottom: 1px solid #333;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            z-index: 10;
        }

        .time-group {
            display: flex;
            gap: 15px;
            align-items: baseline;
        }

        .t-val { color: #fff; font-weight: bold; }
        .t-label { color: #555; font-size: 0.6rem; margin-right: 3px; text-transform: uppercase; }
        
        /* Stile specifico per i numeri veloci */
        .nano-section { color: #00ffcc; font-family: monospace; letter-spacing: 1px; }
        .nano-faint { opacity: 0.5; font-size: 0.7em; }

        /* --- 2. ZONA ROSSA: MAPPA --- */
        #map-wrapper { 
            position: relative; width: 100%; height: 100%; 
            background: #020408; 
            overflow: hidden;
            /* Padding interno per evitare che i poli tocchino i bordi */
            padding: 20px 0; 
        }

        /* Elementi SVG */
        .sphere { fill: #080c10; stroke: none; }
        
        .land { 
            fill: #1f2a36; 
            stroke: #000; 
            stroke-width: 0.2px; 
            transition: fill 0.1s; 
        }

        /* Highlights */
        .land.hovered { fill: #00ffcc !important; fill-opacity: 0.6; }
        .land.same-zone { fill: #00ffcc !important; fill-opacity: 0.2; }

        .night { fill: #000; fill-opacity: 0.8; pointer-events: none; }
        .night-blur { filter: url(#twilight-filter); }

        .graticule { fill: none; stroke: #00ffcc; stroke-width: 0.15px; stroke-opacity: 0.1; }

        /* Cursori Scanner */
        .scanner-line {
            position: absolute; background: #00ffcc; opacity: 0.6; pointer-events: none;
            box-shadow: 0 0 5px #00ffcc; z-index: 5;
        }
        #scanner-x { height: 100%; width: 1px; top: 0; left: 50%; } 
        #scanner-y { width: 100%; height: 1px; top: 50%; left: 0; }
        
        /* Etichetta galleggiante */
        #scanner-label {
            position: absolute; color: #00ffcc; background: rgba(0,0,0,0.8);
            border: 1px solid #00ffcc; padding: 2px 6px; font-size: 0.7rem;
            pointer-events: none; transform: translate(10px, -25px); display: none; z-index: 6;
        }

        /* --- 3. ZONA AZZURRA: INFO PAESE --- */
        .hud-footer {
            padding: 10px 30px;
            background: #050505;
            border-top: 1px solid #00ffcc; /* Bordo azzurro richiesto */
            display: flex; justify-content: space-between; align-items: center;
            height: 60px;
        }

        .info-box { display: flex; flex-direction: column; }
        .info-title { font-size: 0.6rem; color: #00ffcc; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 2px; }
        .info-content { font-size: 1.1rem; color: #fff; font-weight: bold; min-width: 200px; }
        .info-sub { font-size: 0.8rem; color: #777; }

    </style>
</head>
<body>

    <svg style="height:0; position:absolute;">
        <defs>
            <filter id="twilight-filter" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="6" />
            </filter>
        </defs>
    </svg>

    <div id="app-container">
        
        <div class="time-strip">
            <div class="time-group">
                <span><span class="t-label">ERA</span><span class="t-val" id="t-era">--</span></span>
                <span><span class="t-label">MIL</span><span class="t-val" id="t-mil">--</span></span>
                <span><span class="t-label">SEC</span><span class="t-val" id="t-cen">--</span></span>
                <span><span class="t-label">ANNO</span><span class="t-val" id="t-year">--</span></span>
            </div>

            <div class="time-group">
                <span><span class="t-label">SETT</span><span class="t-val" id="t-week">--</span></span>
                <span><span class="t-label">GG</span><span class="t-val" id="t-day">--</span></span>
                <span style="margin: 0 10px; color:#333">|</span>
                <span class="t-val" style="font-size: 1.4rem;" id="t-hms">00:00:00</span>
            </div>

            <div class="time-group" style="width: 180px; justify-content: flex-end;">
                <div class="nano-section">
                    <span id="t-ms" style="font-size:1.1em">.000</span>
                    <span id="t-micro" class="nano-faint">000</span>
                    <span id="t-nano" class="nano-faint" style="opacity:0.3">000</span>
                </div>
            </div>
        </div>

        <div id="map-wrapper">
            <div id="scanner-x" class="scanner-line"></div>
            <div id="scanner-y" class="scanner-line"></div>
            <div id="scanner-label">UTC</div>
        </div>

        <footer class="hud-footer">
            <div class="info-box">
                <span class="info-title">TARGET SECTOR</span>
                <span class="info-content" id="country-name">OCEAN WATERS</span>
                <span class="info-sub" id="country-id">ID: NULL</span>
            </div>

            <div class="info-box" style="align-items: flex-end; text-align: right;">
                <span class="info-title">COORDINATE DATA</span>
                <span class="info-content" id="offset-display">SCANNING...</span>
                <span class="info-sub" id="coords-display">00.0° N, 00.0° E</span>
            </div>
        </footer>
    </div>

    <script>
        const DateTime = luxon.DateTime;
        
        // --- 1. CONFIGURAZIONE MAPPA & SCALA (Fix Zona Rossa) ---
        const mapWrapper = document.getElementById("map-wrapper");
        
        // Creiamo l'SVG
        const svg = d3.select("#map-wrapper").append("svg")
            .attr("width", "100%")
            .attr("height", "100%");

        // Proiezione: Usiamo fitExtent invece di scale manuale per garantire che tutto il mondo sia visibile
        // Lasciamo 20px di margine attorno
        const projection = d3.geoEqualEarth();
        const path = d3.geoPath(projection);

        // Layers
        const gSphere = svg.append("g");
        const gLand = svg.append("g");
        const gGraticule = svg.append("g");
        const gNight = svg.append("g");

        // --- DIZIONARIO PAESI (Fix Zona Azzurra) ---
        // Mappatura manuale ID numerico ISO -> Nome per i principali paesi
        // (TopoJSON 110m contiene solo ID numerici per essere leggero)
        const countryNames = {
            4: "Afghanistan", 8: "Albania", 12: "Algeria", 32: "Argentina", 36: "Australia",
            40: "Austria", 50: "Bangladesh", 56: "Belgium", 68: "Bolivia", 76: "Brazil",
            100: "Bulgaria", 124: "Canada", 152: "Chile", 156: "China", 170: "Colombia",
            192: "Cuba", 203: "Czechia", 208: "Denmark", 218: "Ecuador", 818: "Egypt",
            246: "Finland", 250: "France", 276: "Germany", 300: "Greece", 348: "Hungary",
            352: "Iceland", 356: "India", 360: "Indonesia", 364: "Iran", 368: "Iraq",
            372: "Ireland", 376: "Israel", 380: "Italy", 392: "Japan", 404: "Kenya",
            410: "South Korea", 484: "Mexico", 504: "Morocco", 528: "Netherlands", 
            554: "New Zealand", 566: "Nigeria", 578: "Norway", 586: "Pakistan", 604: "Peru",
            608: "Philippines", 616: "Poland", 620: "Portugal", 642: "Romania", 643: "Russia",
            682: "Saudi Arabia", 710: "South Africa", 724: "Spain", 752: "Sweden", 
            756: "Switzerland", 764: "Thailand", 792: "Turkey", 804: "Ukraine", 
            826: "United Kingdom", 840: "United States", 862: "Venezuela", 704: "Vietnam"
        };
        
        // Offset Politici (come prima)
        const politicalOffsets = {
            156: 8, 356: 5.5, 724: 1, 250: 1, 380: 1, 276: 1, 826: 0, 
            840: -5, 643: 3, 32: -3, 76: -3, 36: 10, 392: 9
        };

        // --- RESIZE INTELLIGENTE ---
        function resizeMap() {
            const w = mapWrapper.clientWidth;
            const h = mapWrapper.clientHeight;
            
            // Adatta la proiezione al rettangolo disponibile con 30px di margine
            // Questo risolve il problema dei poli tagliati
            projection.fitExtent([[20, 20], [w - 20, h - 20]], {type: "Sphere"});
            
            // Aggiorna tutti i percorsi
            svg.selectAll("path").attr("d", path);
        }
        window.addEventListener("resize", resizeMap);

        // --- CARICAMENTO DATI ---
        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(data => {
            const countries = topojson.feature(data, data.objects.countries).features;
            
            // Calcola offset
            countries.forEach(d => {
                const centroid = d3.geoCentroid(d);
                let offset = Math.round(centroid[0] / 15);
                if (politicalOffsets[d.id]) offset = politicalOffsets[d.id];
                d.properties.utcOffset = offset;
                // Assegna nome se disponibile nel nostro dizionario
                d.properties.displayName = countryNames[d.id] || "Unknown Region";
            });

            // Disegna Sfera Base
            gSphere.append("path").datum({type: "Sphere"}).attr("class", "sphere").attr("d", path);

            // Disegna Griglia
            gGraticule.append("path").datum(d3.geoGraticule()).attr("class", "graticule").attr("d", path);

            // Disegna Nazioni
            gLand.selectAll("path")
                .data(countries)
                .enter().append("path")
                .attr("class", "land")
                .attr("d", path)
                .on("mouseenter", function(event, d) {
                    // Update Info Panel (Zona Azzurra)
                    updateCountryInfo(d.properties.displayName, d.id, d.properties.utcOffset);
                    activeCountryOffset = d.properties.utcOffset;
                    d3.select(this).classed("hovered", true);
                })
                .on("mouseleave", function(event, d) {
                    updateCountryInfo("OCEAN WATERS", "NULL", null);
                    activeCountryOffset = null;
                    d3.select(this).classed("hovered", false);
                });

            // Prima chiamata resize per centrare tutto
            resizeMap();
            updateSolarTerminator();
            requestAnimationFrame(updateLoop);
        });

        // --- UI UTILS ---
        const scannerX = document.getElementById("scanner-x");
        const scannerY = document.getElementById("scanner-y");
        const scannerLabel = document.getElementById("scanner-label");
        const infoName = document.getElementById("country-name");
        const infoId = document.getElementById("country-id");
        const offsetDisplay = document.getElementById("offset-display");
        const coordsDisplay = document.getElementById("coords-display");
        
        let activeCountryOffset = null;

        function updateCountryInfo(name, id, offset) {
            infoName.innerText = name;
            infoId.innerText = (id !== "NULL") ? `ISO ID: ${id}` : "SECTOR: OPEN SEA";
            infoName.style.color = (name !== "OCEAN WATERS") ? "#00ffcc" : "#555";
        }

        // --- SCANNER LOGIC ---
        mapWrapper.addEventListener("mousemove", (e) => {
            const rect = mapWrapper.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            scannerX.style.left = x + "px";
            scannerY.style.top = y + "px";
            scannerLabel.style.left = (x + 15) + "px";
            scannerLabel.style.top = (y - 20) + "px";
            scannerLabel.style.display = "block";

            const coords = projection.invert([x, y]);
            if (!coords) return;
            const [lon, lat] = coords;

            // Update Coordinate Display
            coordsDisplay.innerText = `${Math.abs(lat).toFixed(1)}°${lat>0?'N':'S'}, ${Math.abs(lon).toFixed(1)}°${lon>0?'E':'W'}`;

            // Gestione Offset (Politico o Geometrico)
            let offset = activeCountryOffset;
            if (offset === null) offset = Math.round(lon / 15);

            const sign = offset >= 0 ? "+" : "";
            const timeInZone = DateTime.now().toUTC().plus({ hours: offset }).toFormat("HH:mm");
            
            offsetDisplay.innerText = `UTC ${sign}${offset} (${timeInZone})`;
            scannerLabel.innerText = `UTC ${sign}${offset}`;

            // Highlight zone (Simile a prima)
            const allLands = gLand.selectAll("path");
            allLands.classed("same-zone", false);
            allLands.filter(d => d.properties.utcOffset === offset).classed("same-zone", true);
        });

        // --- TEMPO & SOLE (Fix Zona Gialla) ---
        function updateSolarTerminator(date = new Date()) {
            const rad = Math.PI / 180;
            const day = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
            const declination = -23.44 * Math.cos(rad * 360 / 365 * (day + 10));
            const utcHours = date.getUTCHours() + date.getUTCMinutes()/60;
            const antiSun = [(-15 * (utcHours - 12)) + 180, -declination];
            
            const circle = d3.geoCircle().center(antiSun).radius(90)();
            const nightPath = gNight.selectAll("path").data([circle]);
            nightPath.enter().append("path")
                .attr("class", "night night-blur")
                .merge(nightPath).attr("d", path);
        }

        let lastSunUpdate = 0;
        
        function updateLoop() {
            const now = DateTime.now();
            
            // --- AGGIORNAMENTO ZONA GIALLA (TUTTI I DATI) ---
            // Macro
            document.getElementById('t-era').innerText = (now.year + 10000) + " HE";
            document.getElementById('t-mil').innerText = Math.ceil(now.year / 1000);
            document.getElementById('t-cen').innerText = Math.ceil(now.year / 100);
            document.getElementById('t-year').innerText = now.year;
            
            // Medio
            document.getElementById('t-week').innerText = now.weekNumber;
            document.getElementById('t-day').innerText = now.ordinal; // Giorno dell'anno
            document.getElementById('t-hms').innerText = now.toFormat('HH:mm:ss');
            
            // Micro (Reale + Simulato)
            document.getElementById('t-ms').innerText = "." + now.toFormat('SSS');
            
            // Simulazione Micro e Nanosecondi (Estetica)
            // Generiamo numeri casuali perché il browser non ha precisione nanosecondo
            const micro = Math.floor(Math.random() * 999).toString().padStart(3, '0');
            const nano = Math.floor(Math.random() * 999).toString().padStart(3, '0');
            document.getElementById('t-micro').innerText = micro;
            document.getElementById('t-nano').innerText = nano;

            // Aggiornamento Sole (Ogni 1s)
            if (new Date().getTime() - lastSunUpdate > 1000) {
                updateSolarTerminator();
                lastSunUpdate = new Date().getTime();
            }
            requestAnimationFrame(updateLoop);
        }

    </script>
</body>
</html>
