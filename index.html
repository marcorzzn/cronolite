<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cronoLite // Political Scanner</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/luxon/3.4.4/luxon.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    
    <style>
        /* --- CORE STYLES --- */
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            color: #e0e0e0;
            cursor: none; /* Cursore custom */
        }

        #app-container {
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100vh; width: 100vw;
        }

        /* --- HEADER --- */
        .hud-header {
            padding: 15px 30px;
            background: rgba(0,0,0,0.8);
            border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10;
        }

        .main-clock {
            font-size: 2.5rem; font-weight: bold;
            color: #fff; letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
        }
        .milliseconds { color: #00ffcc; font-size: 1rem; }

        /* --- MAPPA --- */
        #map-wrapper { 
            position: relative; width: 100%; height: 100%; 
            background: #020408; 
            overflow: hidden;
        }

        /* Elementi SVG */
        .sphere { fill: #080c10; }
        
        .land { 
            fill: #1f2a36; 
            stroke: #000; 
            stroke-width: 0.3px; 
            transition: fill 0.1s; /* Transizione rapida per effetto scanner */
        }

        /* Nazione Attiva (sotto il mouse) */
        .land.hovered { fill: #00ffcc !important; fill-opacity: 0.6; }
        
        /* Nazioni "Sorelle" (stesso fuso orario) */
        .land.same-zone { fill: #00ffcc !important; fill-opacity: 0.2; }

        /* Ombra Notturna */
        .night { fill: #000; fill-opacity: 0.8; pointer-events: none; }
        .night-blur { filter: url(#twilight-filter); }

        /* Meridiani/Paralleli essenziali */
        .graticule { 
            fill: none; 
            stroke: #00ffcc; 
            stroke-width: 0.2px; 
            stroke-opacity: 0.15; 
            stroke-dasharray: 2,4; 
        }

        /* --- UI SCANNER --- */
        .scanner-line {
            position: absolute;
            background: #00ffcc;
            opacity: 0.8;
            pointer-events: none;
            box-shadow: 0 0 10px #00ffcc;
            z-index: 5;
        }
        #scanner-x { height: 100%; width: 1px; top: 0; left: 50%; } 
        #scanner-y { width: 100%; height: 1px; top: 50%; left: 0; }
        
        /* Etichetta che segue il mouse */
        #scanner-label {
            position: absolute;
            color: #00ffcc;
            background: rgba(0,0,0,0.8);
            border: 1px solid #00ffcc;
            padding: 4px 8px;
            font-size: 0.7rem;
            pointer-events: none;
            white-space: nowrap;
            transform: translate(10px, -30px);
            display: none;
            z-index: 6;
        }

        /* --- FOOTER --- */
        .hud-footer {
            padding: 15px 30px;
            background: rgba(0,0,0,0.95);
            border-top: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.9rem;
            color: #777;
        }
        .data-val { color: #fff; font-weight: bold; font-size: 1.2rem; }
        .data-accent { color: #00ffcc; }

    </style>
</head>
<body>

    <svg style="height:0; position:absolute;">
        <defs>
            <filter id="twilight-filter" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="6" />
            </filter>
        </defs>
    </svg>

    <div id="app-container">
        
        <header class="hud-header">
            <div class="main-clock">
                <span id="clock-hms">00:00:00</span><span class="milliseconds" id="clock-ms">.00</span>
            </div>
            <div style="text-align:right">
                <div style="font-size:0.7rem; color:#00ffcc">POLITICAL SCANNER</div>
                <div style="font-size:0.6rem; color:#555">SYNC: ACTIVE</div>
            </div>
        </header>

        <div id="map-wrapper">
            <div id="scanner-x" class="scanner-line"></div>
            <div id="scanner-y" class="scanner-line"></div>
            <div id="scanner-label">UTC</div>
        </div>

        <footer class="hud-footer">
            <div style="display:flex; flex-direction:column;">
                <span style="font-size:0.6rem; letter-spacing:2px;">OFFSET CORRENTE</span>
                <span class="data-val data-accent" id="offset-display">SCANNING...</span>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end;">
                <span style="font-size:0.6rem; letter-spacing:2px;">TIME IN ZONE</span>
                <span class="data-val" id="zone-time-display">--:--</span>
            </div>
        </footer>
    </div>

    <script>
        const DateTime = luxon.DateTime;
        
        // --- CONFIGURAZIONE ---
        const mapContainer = document.getElementById("map-wrapper");
        const width = mapContainer.clientWidth;
        const height = mapContainer.clientHeight;
        
        const svg = d3.select("#map-wrapper").append("svg")
            .attr("width", width)
            .attr("height", height);

        // Proiezione Equal Earth
        const projection = d3.geoEqualEarth()
            .scale(width / 5.5)
            .translate([width / 2, height / 2]);

        const path = d3.geoPath(projection);

        // Layers
        const gSphere = svg.append("g");
        const gLand = svg.append("g");
        const gGraticule = svg.append("g");
        const gNight = svg.append("g");

        gSphere.append("path").datum({type: "Sphere"}).attr("class", "sphere").attr("d", path);

        // Griglia semplificata (solo paralleli principali e meridiani)
        const graticule = d3.geoGraticule().step([30, 30]);
        gGraticule.append("path").datum(graticule).attr("class", "graticule").attr("d", path);

        // --- MATRICE CORREZIONI POLITICHE (Manual Override) ---
        // L'ISO 3166-1 numeric code è usato dai file topojson standard.
        // Qui mappiamo ID Nazione -> Offset UTC reale (approssimato per le principali)
        // Nota: Per paesi enormi come USA/Russia, questo mappa tutto il paese su un unico offset (es. Washington/Mosca)
        // per mantenere l'effetto "scanner nazione". Dividere USA richiederebbe un file Admin-1 (che lagga).
        const politicalOffsets = {
            156: 8,  // Cina (Tutta UTC+8)
            356: 5.5,// India (UTC+5:30)
            724: 1,  // Spagna (UTC+1 invece di 0)
            250: 1,  // Francia (UTC+1 invece di 0)
            380: 1,  // Italia
            276: 1,  // Germania
            826: 0,  // UK
            840: -5, // USA (Default su East Coast per visualizzazione macro)
            643: 3,  // Russia (Default Mosca)
            32: -3,  // Argentina
            76: -3,  // Brasile (San Paolo)
            36: 10,  // Australia (Sydney)
            392: 9,  // Giappone
        };

        // Cache per gli offset calcolati
        let countryData = []; 

        // --- CARICAMENTO DATI ---
        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(data => {
            const countries = topojson.feature(data, data.objects.countries).features;
            
            // Pre-calcolo Offset per ogni nazione
            countries.forEach(d => {
                // 1. Calcola centroide geometrico
                const centroid = d3.geoCentroid(d);
                const lon = centroid[0];
                
                // 2. Offset geometrico base (Lon / 15)
                let offset = Math.round(lon / 15);

                // 3. Applica correzione politica se esiste
                if (politicalOffsets[d.id]) {
                    offset = politicalOffsets[d.id];
                }

                // Salviamo l'offset dentro l'oggetto dati
                d.properties.utcOffset = offset;
            });

            countryData = countries; // Salva in variabile globale per accesso rapido

            // Disegna Nazioni
            gLand.selectAll("path")
                .data(countries)
                .enter().append("path")
                .attr("class", "land")
                .attr("d", path);

            updateSolarTerminator();
            requestAnimationFrame(updateLoop);
        });

        // --- GESTIONE SCANNER E INTERAZIONE ---
        const scannerX = document.getElementById("scanner-x");
        const scannerY = document.getElementById("scanner-y");
        const scannerLabel = document.getElementById("scanner-label");
        const offsetDisplay = document.getElementById("offset-display");
        const timeDisplay = document.getElementById("zone-time-display");

        mapContainer.addEventListener("mousemove", (e) => {
            const rect = mapContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // 1. Muovi Scanner
            scannerX.style.left = x + "px";
            scannerY.style.top = y + "px";
            scannerLabel.style.left = x + "px";
            scannerLabel.style.top = y + "px";
            scannerLabel.style.display = "block";

            // 2. Logica di Rilevamento
            // D3 invert trova Lat/Lon dal mouse
            const coords = projection.invert([x, y]);
            if (!coords) return; // Fuori mappa
            const [lon, lat] = coords;

            // Variabile per l'offset rilevato
            let detectedOffset = null;
            let hoveredCountryId = null;

            // A. Cerchiamo se il mouse è SOPRA una nazione (Politico)
            // (Iterare su tutti i path è pesante, usiamo una tecnica più leggera o accettiamo l'iterazione su 180 elementi che è veloce)
            // Usiamo d3-polygon o pointInPolygon? Per semplicità in file unico, calcoliamo la distanza dal centroide (approssimazione)
            // o meglio: lasciamo che sia il "mouse over" dell'SVG a dircelo?
            // Sì, usiamo l'evento "mouseover" diretto sugli elementi SVG per sapere la nazione.
            // Ma qui siamo nel "mousemove" del container. 
            
            // Per reattività massima, usiamo la logica Geometrica come base, e la sovrascriviamo se siamo su un SVG path.
            // La gestione "hovered" è fatta via CSS/JS events sotto.
            
            // Qui calcoliamo l'offset geometrico di base (Ocean fallback)
            let geoOffset = Math.round(lon / 15);
            detectedOffset = geoOffset;

            // Se stiamo "hoverando" una nazione specifica (gestito da event listeners sotto), usiamo quello.
            if (activeCountryOffset !== null) {
                detectedOffset = activeCountryOffset;
            }

            // 3. Applica Visualizzazione
            updateHighlighting(detectedOffset, hoveredCountryId);
            updateInfoDisplay(detectedOffset);
        });

        // Variabile globale per comunicare tra SVG hover e Scanner
        let activeCountryOffset = null;

        // Aggiungiamo Listener agli elementi SVG (solo quando caricati)
        // Questo deve essere fatto DOPO il caricamento JSON, ma D3 lo gestisce con .on() dinamico se usiamo selectAll
        // Ma nel codice sopra abbiamo creato i path staticamente. Aggiungiamo logica lì.
        
        // --- FUNZIONE DI HIGHLIGHT ---
        function updateHighlighting(targetOffset) {
            // Seleziona tutte le nazioni
            const allLands = gLand.selectAll("path");

            // Rimuovi classi
            allLands.classed("same-zone", false);
            allLands.classed("hovered", false);

            // Filtra e colora
            allLands.filter(d => d.properties.utcOffset === targetOffset)
                    .classed("same-zone", true);
            
            // Nota: La classe .hovered specifica per la singola nazione sotto il mouse 
            // la gestiamo con CSS :hover nativo o D3 events per massima velocità.
        }

        function updateInfoDisplay(offset) {
            const sign = offset >= 0 ? "+" : "";
            const text = `UTC ${sign}${offset}`;
            
            offsetDisplay.innerText = text;
            offsetDisplay.style.color = (activeCountryOffset !== null) ? "#00ffcc" : "#555"; // Ciano se politico, Grigio se oceano
            
            scannerLabel.innerText = text;

            // Calcola ora locale
            const timeInZone = DateTime.now().toUTC().plus({ hours: offset }).toFormat("HH:mm");
            timeDisplay.innerText = timeInZone;
        }

        //
